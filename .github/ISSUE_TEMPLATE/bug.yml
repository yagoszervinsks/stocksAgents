name: Bug
description: Registrar um defeito reproduzível
title: "[bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidência sem dados sensíveis
